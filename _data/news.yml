- date: Aug 2026
  summary: Three papers accepted to EMNLP 2026
  text: "\U0001F389\U0001F389 Three papers accepted to [EMNLP'26](https://2026.emnlp.org/):
    [OpenSkill](https://openlair.github.io/openskill/) to the main conference, [Dr.
    Claw](https://github.com/OpenLAIR/dr-claw) to the System Demonstrations Track,
    and [ClawBench](https://claw-bench.com) to Findings!"
- date: June 2026
  text: "\U0001F334 Started a summer research internship at [Salesforce AI Research](https://www.salesforceairesearch.com/)
    in Palo Alto!"
- date: June 2026
  text: "\U0001F9BE [OpenSkill](https://openlair.github.io/openskill/) released —
    open-world self-evolution for LLM agents! [\U0001F4C3 paper](https://arxiv.org/abs/2606.06741),
    [code](https://github.com/OpenLAIR/OpenSkill)."
- date: May 2026
  text: "\U0001F389\U0001F389 [LiveMedBench](https://arxiv.org/abs/2602.10367) was
    accepted to [KDD'26](https://kdd2026.kdd.org/) (Datasets and Benchmarks Track)!"
- date: May 2026
  text: "\U0001F99E [Dr. Claw](https://github.com/OpenLAIR/dr-claw) open-sourced —
    a full-stack AI research workspace with multi-agent support and 100+ research
    skills; featured by [Lehigh Engineering](https://engineering.lehigh.edu/news/article/meet-dr-claw-open-source-ai-assistant-revolutionizing-research-workflow)!
    [\U0001F310 Website](https://openlair.github.io/dr-claw/)"
- date: May 2026
  text: "\U0001F4C3 [AutoResearch AI](https://arxiv.org/abs/2605.23204) preprint released
    — toward AI-powered research automation for scientific discovery."
- date: Mar 2026
  text: "\U0001F4C3 New preprints released: [Towards a Medical AI Scientist](https://arxiv.org/abs/2603.28589)
    and [ScratchMath](https://arxiv.org/abs/2603.24961)."
- date: Aug 2025
  text: "\U0001F389\U0001F389 <a href=\"https://github.com/MLLM-Data-Contamination/MM-Detect\">MM-Detect</a>
    and <a href=\"https://github.com/FreedomIntelligence/LongLLaVA\">LongLLaVA</a>
    were accepted to <a href=\"https://2025.emnlp.org/\">EMNLP Findings'25</a>!"
- date: July 2025
  text: "\U0001F389\U0001F389 <a href=\"https://github.com/ZhilingYan/Medical-SAM-Bench\">SAMed-2</a>
    was accepted to <a href=\"https://www.miccai.org/\">MICCAI'25</a>!"
- date: June 2025
  text: "\U0001F389\U0001F389 <a href=\"https://github.com/MLLM-Data-Contamination/MM-Detect\">MM-Detect</a>
    was accepted to <a href=\"https://icml2025digbugs.github.io/\">ICML'25 DIG-BUG
    Workshop</a>!"
- date: May 2025
  text: "\U0001F389\U0001F389 <a href=\"https://github.com/FreedomIntelligence/Med-MAT\">Med-MAT</a>
    was accepted to <a href=\"https://2025.aclweb.org/\">ACL'25</a> main conference!"
- date: Jan 2025
  text: "\U0001F389\U0001F389 <a href=\"https://arxiv.org/abs/2311.13951\">MLLM-Bench</a>
    was accepted to <a href=\"https://2025.naacl.org/\">NAACL'25</a> main conference!"
- date: Dec 2024
  text: "\U0001F389\U0001F389 <a href=\"https://arxiv.org/abs/2409.10994\">TRIM</a>
    was accepted to <a href=\"https://coling2025.org/\">COLING'25</a> main conference!"
- date: Nov 2024
  text: "<strong>MM-Detect</strong> \U0001F575️ released! MM-Detect is the first <strong>Data
    Contamination Detection Framework</strong> for MLLMs!  More information can be
    found in <a href=\"https://arxiv.org/abs/2411.03823\">\U0001F4C3 paper</a> and
    the <a href=\"https://github.com/MLLM-Data-Contamination/MM-Detect\">GitHub</a>."
- date: Sep 2024
  text: "<strong>TRIM</strong> ✂️ released! TRIM is a simple yet effective <strong>Image
    Token Reduction Method</strong> for efficient MLLMs!  More information can be
    found in <a href=\"https://arxiv.org/abs/2409.10994\">\U0001F4C3 paper</a>, <a
    href=\"https://huggingface.co/FreedomIntelligence/llava-v1.5-7b-TRIM\">\U0001F917
    HuggingFace</a> and the <a href=\"https://github.com/FreedomIntelligence/TRIM\">GitHub</a>."
- date: Sep 2024
  text: "<strong>LongLLaVA</strong> \U0001F40D\U0001F999 released! LongLLaVA is the
    first MLLM with <strong>hybrid architecture</strong> that can handle up to <strong>1000
    images</strong>!  More information can be found in <a href=\"https://arxiv.org/abs/2409.02889\">\U0001F4C3
    paper</a>, <a href=\"https://huggingface.co/FreedomIntelligence/LongLLaVA\">\U0001F917
    HuggingFace</a> and the <a href=\"https://github.com/FreedomIntelligence/LongLLaVA\">GitHub</a>.
    \U0001F948#2 Paper of the day on <a href=\"https://huggingface.co/papers/2409.02889\">Huggingface
    Daily Paper</a>."
- date: July 2024
  text: "\U0001F389\U0001F389 Two papers <a href=\"https://milebench.github.io/\">MileBench</a>
    and <a href=\"https://www.huatuogpt.cn/#/\">HuatuoGPT2</a> were accepted to <a
    href=\"https://colmweb.org/\">COLM'24</a> main conference!"
- date: April 2024
  text: "<strong>MileBench</strong> \U0001F6E3️ released! MileBench is a pioneering
    benchmark designed to rigorously test the <strong>MultImodal Long-contExt capabilities
    of MLLMs</strong>.  More information can be found on the <a href=\"https://milebench.github.io/\">\U0001F310
    website</a>, <a href=\"https://arxiv.org/abs/2404.18532\">\U0001F4C3 paper</a>,
    <a href=\"https://huggingface.co/datasets/FreedomIntelligence/MileBench\">\U0001F917
    HuggingFace</a> and the <a href=\"https://github.com/MileBench/MileBench\">GitHub</a>."
- date: March 2024
  text: "\U0001F389\U0001F389 Two papers <a href=\"https://github.com/FreedomIntelligence/CMB\">CMB</a>
    and <a href=\"https://arxiv.org/abs/2309.12053\">AceGPT</a> were accepted to <a
    href=\"https://2024.naacl.org/\">NAACL'24</a> main conference!"
- date: Nov 2023
  text: "HuatuoGPT2 released! Try it out on the <a href=\"https://www.huatuogpt.cn/#/\">\U0001F310
    demo</a>! HuatuoGPT2 employs an innovative domain adaptation method to significantly
    boost its medical knowledge and dialogue proficiency and showcases SOTA performance
    in several medical benchmarks, especially <strong>surpassing GPT-4 in expert evaluations
    and the fresh medical licensing exams</strong>. More info can be found in <a href=\"https://arxiv.org/abs/2311.09774\">\U0001F4C3
    paper</a> and <a href=\"https://huggingface.co/FreedomIntelligence/HuatuoGPT2-34B\">\U0001F917
    HuggingFace</a>."
- date: Sep 2023
  text: "We publish AceGPT that achieved <strong>top performance</strong> among open-source
    Arabic language models in benchmark tests. More info can be found in <a href=\"https://arxiv.org/abs/2309.12053\">\U0001F4C3
    paper</a> and <a href=\"https://huggingface.co/FreedomIntelligence/AceGPT-13B-chat\">\U0001F917
    HuggingFace</a>."
- date: Aug 2023
  text: "<a href=\"https://arxiv.org/abs/2308.08833\">Checkout our \U0001F4C3 new
    paper</a> that focuses on benchmarking prevalent Medical LLMs for their medical
    knowledge and clinical diagnostic capabilities. More information can be found
    on the <a href=\"https://github.com/FreedomIntelligence/CMB\">\U0001F310 website</a>
    and the <a href=\"https://huggingface.co/datasets/FreedomIntelligence/CMB\">\U0001F917
    HuggingFace</a>."
- date: Jul 2023
  text: Start the journey in CUHK-sz as a research assistant under the guidance of
    <a href="https://scholar.google.com/citations?user=Jk4vJU8AAAAJ">Benyou Wang</a>.
- date: Jun 2023
  text: I defended my master's degree and got my master's degree in software engineering.
    Thanks to all those who have supported me.
- date: Aug 2022 - Apr 2023
  text: Finished my internship with <a href="https://scholar.google.com/citations?user=ozXuhOUAAAAJ">Jiaxing
    Zhang</a> on LLM SFT.
