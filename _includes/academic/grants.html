<section class="card awards-card grants-card" aria-labelledby="funding">
  <h2 id="funding">{% include academic/icon.html name="funding" %} Research Funding</h2>
  <ul class="award-list grant-list list-unstyled">
    {% for grant in site.data.profile.grants %}<li><span><strong>{{ grant.role }}</strong>, {{ grant.program }} ({{ grant.id }}): <em>{{ grant.title }}</em><span class="grant-detail">{% if grant.type %}{{ grant.type }} · {% endif %}{{ grant.detail }}</span></span><span class="date">{{ grant.date }}</span></li>{% endfor %}
  </ul>
</section>
