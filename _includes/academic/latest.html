{% assign latest = site.data.news | first %}
{% if latest %}
<nav class="latest-research" aria-label="Latest news">
  <span class="latest-label">{% include academic/icon.html name='sparkle' %} Latest News</span>
  <a class="latest-summary" href="#news">{{ latest.summary | default: latest.text | markdownify | strip_html | strip }} {% include academic/icon.html name='arrow' %}</a>
  <span class="date">{{ latest.date }}</span>
</nav>
{% endif %}
